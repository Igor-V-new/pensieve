<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PENSIEVE // Нейросеть памяти</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Canvas с нейросетью -->
  <canvas id="neuralCanvas"></canvas>

  <!-- Сканирующая линия -->
  <div class="scan-line"></div>

  <!-- HUD-уголки -->
  <div class="hud-corner hud-tl"></div>
  <div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div>
  <div class="hud-corner hud-br"></div>

  <!-- Радар в правом верхнем углу -->
  <div class="radar">
    <div class="radar-circle radar-c1"></div>
    <div class="radar-circle radar-c2"></div>
    <div class="radar-circle radar-c3"></div>
    <div class="radar-sweep"></div>
    <div class="radar-dot"></div>
    <div class="radar-label">SCAN</div>
  </div>

  <!-- Терминал-лог справа снизу -->
  <div class="terminal" id="terminal">
    <div class="terminal-header">
      <span class="terminal-dot"></span>
      <span>SYS.LOG</span>
    </div>
    <div class="terminal-body" id="terminalBody"></div>
  </div>

  <!-- Левый нижний HUD: координаты и статус -->
  <div class="hud-status">
    <div class="hud-row"><span class="hud-key">CURSOR</span><span id="hudCursor" class="hud-val">0, 0</span></div>
    <div class="hud-row"><span class="hud-key">FPS</span><span id="hudFps" class="hud-val">60</span></div>
    <div class="hud-row"><span class="hud-key">NODES</span><span id="hudNodes" class="hud-val">0</span></div>
    <div class="hud-row"><span class="hud-key">STATUS</span><span class="hud-val hud-ok">● ONLINE</span></div>
  </div>

  <!-- Header -->
  <header class="header">
    <h1>PENSIEVE <span class="dim">//</span> MEMORY NETWORK</h1>
    <p class="subtitle">[ нейросеть активна · узлов: <span id="nodeCount">0</span> ]</p>
  </header>

  <!-- Основной UI -->
  <main class="container">
    <section class="panel" id="formPanel">
      <button class="panel-toggle" id="toggleForm">＋ НОВЫЙ УЗЕЛ</button>
      <form id="memoryForm" class="memory-form hidden">
        <input type="text" id="title" placeholder="НАЗВАНИЕ" maxlength="60" required />
        <textarea id="text" placeholder="ОПИСАНИЕ ВОСПОМИНАНИЯ..." maxlength="500" rows="3" required></textarea>
        <div class="row">
          <input type="date" id="date" required />
          <input type="text" id="tag" placeholder="ТЕГ" maxlength="20" />
        </div>
        <button type="submit">СОЗДАТЬ УЗЕЛ</button>
      </form>
    </section>

    <section class="controls">
      <input type="text" id="search" placeholder="🔍 СКАНИРОВАТЬ ПАМЯТЬ..." />
      <div id="tagFilters" class="tag-filters"></div>
    </section>
  </main>

  <!-- Модалка -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-id">NODE // <span id="modalId"></span></span>
        <button id="closeModal" class="close-btn">✕</button>
      </div>
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalText"></p>
      <span id="modalTag" class="tag"></span>
    </div>
  </div>

  <script src="neural.js"></script>
  <script src="script.js"></script>
</body>
</html>
